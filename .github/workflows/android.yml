name: Build Launcher APK

on:
  push:
    branches: [ v26-from-v23 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply gesture UX patch
        run: python3 scripts/apply_gesture_ux.py

      - name: Apply version 22 grid polish
        run: python3 scripts/apply_v22_layout.py

      - name: Apply version 23 minimal header
        run: python3 scripts/apply_v23_layout.py

      - name: Apply version 26 add-app fix
        run: python3 scripts/apply_v26_add_button.py

      - name: Apply version 28 dynamic icon refresh
        run: python3 scripts/apply_v28_dynamic_icon_refresh.py

      - name: Apply version 29 daily quote header
        run: python3 scripts/apply_v29_daily_quote.py

      - name: Fix generated imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ahbe/mylauncher/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import androidx.compose.ui.input.pointer.awaitFirstDown\n', '')
          s = s.replace('import sh.calvin.reorderable.longPressDraggableHandle\n', '')
          imp = 'import androidx.compose.foundation.gestures.awaitFirstDown\n'
          if 'awaitFirstDown(' in s and imp not in s:
              s = s.replace('import androidx.compose.foundation.gestures.awaitEachGesture\n','import androidx.compose.foundation.gestures.awaitEachGesture\n' + imp)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Download Vazirmatn font
        run: |
          mkdir -p app/src/main/res/font
          curl -L --fail --retry 3 \
            https://github.com/rastikerdar/vazirmatn/raw/refs/heads/master/fonts/ttf/Vazirmatn-Regular.ttf \
            -o app/src/main/res/font/vazirmatn_regular.ttf

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-v29-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
