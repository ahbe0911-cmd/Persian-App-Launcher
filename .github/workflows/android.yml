name: Build Launcher APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply gesture UX patch
        run: python3 scripts/apply_gesture_ux.py

      - name: Fix gesture imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ahbe/mylauncher/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          imp = 'import androidx.compose.foundation.gestures.awaitFirstDown\n'
          if imp not in s:
              s = s.replace(
                  'import androidx.compose.foundation.gestures.awaitEachGesture\n',
                  'import androidx.compose.foundation.gestures.awaitEachGesture\n' + imp
              )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Download Vazirmatn font
        run: |
          mkdir -p app/src/main/res/font
          curl -L --fail --retry 3 \
            https://github.com/rastikerdar/vazirmatn/raw/refs/heads/master/fonts/ttf/Vazirmatn-Regular.ttf \
            -o app/src/main/res/font/vazirmatn_regular.ttf

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
